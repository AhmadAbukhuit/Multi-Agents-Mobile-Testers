services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - ./config:/config:ro
    entrypoint:
      - /bin/sh
      - -c
      - "ollama pull ${OLLAMA_BASE_MODEL:-qwen2.5vl:7b} && ollama create ${OLLAMA_MODEL:-qwen2.5vl-32k} -f /config/Modelfile"
    restart: "no"

  agents-api:
    build:
      context: .
      dockerfile: services/agents_api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - config/ollama.env
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5vl-32k}"
      OLLAMA_USE_LANGCHAIN: "1"
      ADB_CONNECT_HOST: "${ADB_CONNECT_HOST:-android-emulator:5555}"
      ANDROID_SERIAL: "${ANDROID_SERIAL:-android-emulator:5555}"
    volumes:
      - ./results:/workspace/results
      - ./config:/workspace/config:ro
      - ./briefs:/workspace/briefs:ro
    depends_on:
      ollama:
        condition: service_healthy
      android-emulator:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    environment:
      AGENTS_API_URL: "http://agents-api:8000"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./results:/workspace/results

  android-emulator:
    image: budtmo/docker-android:emulator_14.0
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "6080:6080"
      - "5555:5555"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"

volumes:
  ollama_data:
